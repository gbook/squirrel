[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "squirrel"
version = "2026.10.503"
description = "Python bindings for the squirrel data package library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gregory A Book", email = "gregory.a.book@gmail.com" }]

[tool.scikit-build]
wheel.packages = ["squirrel"]
cmake.build-type = "Release"
# Qt, bit7z, and DCMTK locations are passed through CMake cache variables, e.g.
#   pip install . --config-settings=cmake.define.QT_ROOT=$HOME/Qt/6.9.3/gcc_64

[tool.cibuildwheel]
# Run from the repo root (see packaging/build-wheels.sh): the container needs src/ too.
build = ["cp39-manylinux_x86_64", "cp310-manylinux_x86_64", "cp311-manylinux_x86_64",
         "cp312-manylinux_x86_64", "cp313-manylinux_x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
build-verbosity = 1
before-all = "bash {project}/python/packaging/before-all.sh {project}"
test-requires = "pytest"
test-command = "pytest {project}/python/tests"

[tool.cibuildwheel.linux]
environment = { SKBUILD_CMAKE_DEFINE = "SQUIRREL_LIB_DIR=/opt/squirrel-deps/squirrel;SQUIRREL_7ZIP_DIR=/opt/squirrel-deps/7zip;QT_ROOT=/opt/Qt/6.9.3/gcc_64", LD_LIBRARY_PATH = "/opt/Qt/6.9.3/gcc_64/lib:/usr/local/lib:/usr/local/lib64" }
# Qt, ICU, DCMTK, and OpenSSL are copied into squirrel.libs/ by auditwheel.
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
